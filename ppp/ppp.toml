# =====================================================================
# PPP 配置文件
# 优先级：命令行参数 > 本文件 > pppConfig.py DEFAULT_CONFIG
# =====================================================================

# ================= 系统/卫星/波段 =================
systems = ["G", "C", "E"]
# 各系统双频波段组合，默认 G:C1C,C2W; C:C2I,C6I; E:C1X,C5X
bands = "G:C1C,C2W;C:C2I,C6I;E:C1X,C5X"
# 排除的卫星 BDS GEO = ["C01","C02","C03","C04","C05"]；剔除整个 BDS-2 用 C01~C14
exclude_sats = []

# ================= 定位模式与高度角 =================
elev_cutoff_deg = 10.0        # 高度角截止角（度）
mode = "static"              # static 静态 | kinematic 动态

# ================= 权阵 =================
# 高度角定权：sigma = sigma0 * (a + b/sin(el))，sigma0 按码/载波分别取 sigma_p/sigma_l
sigma_p = 0.3                # 伪距噪声
sigma_l = 0.003              # 载波噪声基准
sigma_elev_a = 1.0           # 定权系数 a
sigma_elev_b = 1.0           # 定权系数 b

# ================= 天顶湿延迟 ZWD（随机游走）=================
est_zwd = true               # 估计对流层天顶湿延迟
sigma_zwd_init = 0.1         # ZWD 初值方差 (m)^2
q_zwd = 1e-8                 # ZWD 过程噪声方差率 (m^2/s)

# ================= 对流层梯度（MacMillan 模型，需 est_zwd）=================
est_trop_grad = true        # 估计北/东对流层梯度 Gn/Ge
sigma_grad_init = 0.01       # 梯度初值方差
q_grad = 1e-8                # 梯度过程噪声方差率

# ================= 滤波初值与过程噪声 =================
sigma_pos_init = 100.0       # 坐标初值方差 (m)^2
sigma_clk = 100.0            # 接收机钟差：白噪声标准差 (m)
sigma_amb = 100.0            # 模糊度初值方差（距离域 (m)^2）
q_pos_kinematic = 100.0      # 动态模式位置随机游走方差率 (m^2/s)

# ================= 误差模型 =================
# trop_prior: saas_nmf = Saastamoinen 干延迟 + NMF 干/湿分离映射
#             collins  = Collins 经验全延迟先验
trop_prior = "saas_nmf"      # 对流层先验模型
windup = true                # 相位缠绕改正
solid_tide = true            # 固体潮改正

# ================= 精密产品 =================
atx_file = "ppptest/data/igs20.atx"                                  # ANTEX 天线 PCO/PCV
blq_file = "ppptest/data/FES2004_DXS.BLQ"                            # BLQ 海潮载荷
dcb_file = "ppptest/data/CAS0MGXRAP_20222670000_01D_01D_DCB.BSX"     # 码偏差
erp_file = "ppptest/data/igs22287.erp"
rec_ant_delta = true                          # 施加 RINEX 头 DELTA H/E/N 读取
rec_antenna = ""                              # 接收机天线类型，留空时取 RINEX 头 ANT # / TYPE

# ================= 精密星历处理 =================
sp3_pos_order = 10           # 轨道 Lagrange 内插阶数
sp3_clk_interp = "linear"    # 钟差内插方式：linear | lagrange
sp3_apply_rel = true         # 补周期相对论钟差（IGS 精密钟差约定不含 -2r*v/c^2；产品已含则关闭）
use_sat_var = true           # 量测 R 叠加 SP3 轨道/钟差方差
phase_code_jump = true       # 毫秒级接收机钟跳检测与模糊度平移
phase_jump_thresh_m = 10.0   # 载波码-相一致性平移阈值(米)：接收机钟 Stepping(码跟随、相位连续)
                             # 使码-相发散累积，超过该阈值的载波共模新息整体平移模糊度予以恢复
carrier_reject_thresh_m = 1000.0 # 载波拒绝门限下限(米)

# ================= 周跳探测 =================
slip_mw_sigma = 4.0          # MW 组合周跳阈值
slip_gf_thresh = 0.10        # GF 无几何组合周跳阈值 (m)
gap_reset_sec = 120.0        # 观测中断超过该时长（秒）重置弧段/模糊度

# ================= 质量控制 =================
outlier_nsigma = 3.0         # 新息粗差剔除阈值
min_sat = 4                  # 最少卫星数
ref_mean_skip_min = 0        # ENU 参考坐标均值跳过前 N 分钟（无 SNX 时用）
ppp_conv_thresh = 0.3        # 绘图收敛判据：3D 误差阈值 (m)
ppp_conv_hold = 5            # 收敛判据需持续保持的时长（分钟）

# ================= 输出 =================
plot = true                  # 是否绘图
